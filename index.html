<meta property="og:description" content="教材・プリント用の2D・3D図形を数値入力から生成し、高解像度PNGやSVGとして保存できるブラウザ完結の無料ツール。ファイルは外部送信しません。">

  "@graph": [
    {
      "@type": "WebApplication",
      "name": "図形作成さん",
      "url": "https://edi-tool.github.io/zukei-drafter/",
      "description": "教材・プリント用の2D・3D図形を数値入力から生成し、高解像度PNGやSVGとして保存できるブラウザ完結の無料ツール。",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },
      "inLanguage": "ja",

      "publisher": { "@id": "https://edi-tool.github.io/#organization" }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "edi-tool", "item": "https://edi-tool.github.io/" },

<body>
<header class="app-header">
  <div class="app-header-top">
    <a class="hub-link" href="https://edi-tool.github.io/">edi-tool</a>
    <h1>図形作成さん</h1>
  </div>
  <div class="header-actions">
    <button type="button" class="ghost-btn" id="btn-copy-link" title="今の設定を再現できるリンクをコピー">リンクをコピー</button>
    <button type="button" class="ghost-btn" id="btn-reset" title="すべての入力を初期値に戻す">初期値に戻す</button>
  </div>
  <div class="mode-switch" role="tablist" aria-label="モード切替">
    <button type="button" class="mode-btn active" data-mode="2d" role="tab" aria-selected="true">2次元</button>
    <button type="button" class="mode-btn" data-mode="3d" role="tab" aria-selected="false">3次元</button>
  </div>
</header>

<main class="app-main">
  <section class="panel" id="panel">
    <!-- 2D panel -->
    <div class="mode-panel" id="panel-2d">
      <div class="field">
        <span id="shape2d-type-label">種類</span>
        <div class="chips chips-icons" data-for="shape2d-type" aria-labelledby="shape2d-type-label"></div>
        <select id="shape2d-type" hidden>
          <option value="regular">正多角形</option>
          <option value="triangle">三角形</option>
          <option value="general">一般多角形</option>
        </select>
      </div>

      <fieldset id="fieldset-regular" class="shape-fieldset">
        <legend>正多角形</legend>
        <label class="field"><span>頂点数 (3〜20)</span>
          <input type="number" required id="regular-sides" min="3" max="20" step="1" value="6" />
        </label>
        <label class="field"><span>一辺の長さ</span>
          <input type="number" required id="regular-side-length" min="0.01" step="0.1" value="40" />
        </label>
        <label class="field"><span>回転角 (度、0で底辺が水平)</span>
          <input type="number" required id="regular-rotation" step="1" value="0" />
        </label>
        <p class="error-message" id="regular-error"></p>
      </fieldset>

      <fieldset id="fieldset-triangle" class="shape-fieldset" hidden>
        <legend>三角形</legend>
        <div class="field"><span>よく使う形</span>
          <div class="preset-row">
            <button type="button" class="preset-btn" data-preset="equilateral">正三角形</button>
            <button type="button" class="preset-btn" data-preset="right345">直角三角形 (3:4:5)</button>
            <button type="button" class="preset-btn" data-preset="isosceles">二等辺三角形</button>
          </div>
        </div>
        <div class="field"><span id="triangle-method-label">決め方</span>
          <div class="chips" data-for="triangle-method" aria-labelledby="triangle-method-label"></div>
          <select id="triangle-method" hidden>
            <option value="sss">SSS（3辺）</option>
            <option value="sas">SAS（2辺と間の角）</option>
            <option value="asa">ASA（1辺と両端の角）</option>
          </select>
        </div>
        <div id="triangle-sss" class="triangle-inputs">
          <label class="field"><span>辺 AB（底辺）</span><input type="number" required id="sss-a" min="0.01" step="0.1" value="50" /></label>
          <label class="field"><span>辺 AC</span><input type="number" required id="sss-b" min="0.01" step="0.1" value="60" /></label>
          <label class="field"><span>辺 BC</span><input type="number" required id="sss-c" min="0.01" step="0.1" value="70" /></label>
        </div>
        <div id="triangle-sas" class="triangle-inputs" hidden>
          <label class="field"><span>辺 AB（底辺）</span><input type="number" required id="sas-a" min="0.01" step="0.1" value="50" /></label>
          <label class="field"><span>間の角 A (度)</span><input type="number" required id="sas-angle" min="0.01" max="179.99" step="0.1" value="60" /></label>
          <label class="field"><span>辺 AC</span><input type="number" required id="sas-b" min="0.01" step="0.1" value="60" /></label>
        </div>
        <div id="triangle-asa" class="triangle-inputs" hidden>
          <label class="field"><span>辺 AB（底辺）</span><input type="number" required id="asa-side" min="0.01" step="0.1" value="60" /></label>
          <label class="field"><span>角 A (度)</span><input type="number" required id="asa-angle-a" min="0.01" max="179.99" step="0.1" value="60" /></label>
          <label class="field"><span>角 B (度)</span><input type="number" required id="asa-angle-b" min="0.01" max="179.99" step="0.1" value="60" /></label>
        </div>
        <p class="error-message" id="triangle-error"></p>
      </fieldset>

      <fieldset id="fieldset-general" class="shape-fieldset" hidden>
        <legend>一般多角形</legend>
        <label class="field"><span>頂点数</span>
          <input type="number" required id="general-count" min="3" max="20" step="1" value="4" />
        </label>
        <p class="hint">方向角は基準（右方向・3時の方向）を0度として反時計回りに測った絶対角です。前の辺からの曲がり角ではありません。</p>
        <div id="general-edges"></div>
        <p class="error-message" id="general-error"></p>
      </fieldset>

      <fieldset id="fieldset-annotations" class="shape-fieldset">
        <legend>寸法・注釈</legend>
        <label class="check-field"><input type="checkbox" id="ann-vertex-names" /> 頂点名（A, B, C…）</label>
        <label class="check-field"><input type="checkbox" id="ann-lengths" /> 辺の長さ</label>
        <label class="check-field"><input type="checkbox" id="ann-angles" /> 角度（内角）</label>
        <label class="field"><span>直角記号</span>
          <select id="ann-right-angles">
            <option value="hidden">非表示</option>
            <option value="auto">自動（90°で表示）</option>
          </select>
        </label>
        <div id="ann-options" hidden>
          <label class="field" id="ann-length-style-field"><span>長さの表示</span>
            <select id="ann-length-style">
              <option value="label">数値のみ</option>
              <option value="dimension">寸法線</option>
            </select>
          </label>
          <label class="field" id="ann-unit-field"><span>長さの単位（例: cm、空欄可）</span>
            <input type="text" id="ann-unit" maxlength="8" value="" />
          </label>
          <label class="field"><span>小数点以下の桁数 (0〜4)</span>
            <input type="number" required id="ann-decimals" min="0" max="4" step="1" value="1" />
          </label>
          <label class="field"><span>文字サイズ (px、長辺800基準)</span>
            <input type="number" required id="ann-font-size" min="6" max="72" step="1" value="18" />
          </label>
        </div>
      </fieldset>
    </div>

    <!-- 3D panel -->
    <div class="mode-panel" id="panel-3d" hidden>
      <div class="field">
        <span id="shape3d-type-label">形状</span>
        <div class="chips chips-icons" data-for="shape3d-type" aria-labelledby="shape3d-type-label"></div>
        <select id="shape3d-type" hidden>
          <option value="cube">立方体</option>
          <option value="box">直方体</option>
          <option value="triangularPrism">三角柱</option>
          <option value="quadrangularPrism">四角柱</option>
          <option value="triangularPyramid">三角錐</option>
          <option value="quadrangularPyramid">四角錐</option>
          <option value="cylinder">円柱</option>
          <option value="cone">円錐</option>
        </select>
      </div>
      <div id="shape3d-params"></div>
      <p class="error-message" id="shape3d-error"></p>

      <div class="field">
        <span id="projection-type-label">投影法</span>
        <div class="chips" data-for="projection-type" aria-labelledby="projection-type-label"></div>
        <select id="projection-type" hidden>
          <option value="isometric">等角投影</option>
          <option value="cavalier">カバリエ投影</option>
          <option value="cabinet">キャビネット投影</option>
          <option value="oblique">任意斜投影</option>
        </select>
      </div>
      <div id="oblique-params" hidden>
        <label class="field"><span>奥行き方向角度 (度)</span>
          <input type="number" required id="oblique-angle" step="1" value="45" />
        </label>
        <label class="field"><span>奥行き倍率</span>
          <input type="number" required id="oblique-scale" step="0.05" min="0.05" max="2" value="0.5" />
        </label>
        <p class="error-message" id="oblique-error"></p>
      </div>

      <label class="field">
        <span>隠線</span>
        <select id="hidden-line-mode">
          <option value="dashed">破線で表示</option>
          <option value="hidden">表示しない</option>
        </select>
      </label>
    </div>

    <fieldset class="shape-fieldset">
      <legend>線・塗りの設定</legend>
      <label class="field"><span>線色</span><input type="color" id="style-stroke" value="#111111" /></label>
      <label class="field"><span>線幅</span><input type="number" required id="style-stroke-width" min="0.5" step="0.5" value="2" /></label>
      <label class="field"><span>塗り</span>
        <select id="style-fill-mode">
          <option value="none">なし</option>
          <option value="white">白</option>
          <option value="custom">任意色</option>
        </select>
      </label>
      <input type="color" id="style-fill-color" value="#ffffff" hidden />
    </fieldset>

    <fieldset class="shape-fieldset export-fieldset">
      <legend>PNG出力設定</legend>
      <label class="field"><span>背景</span>
        <select id="png-background">
          <option value="transparent">透明</option>
          <option value="white">白</option>
        </select>
      </label>
      <label class="field"><span>解像度</span>
        <select id="png-resolution">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="4">4x</option>
          <option value="custom">幅を指定</option>
        </select>
      </label>
      <label class="field" id="png-custom-width-field" hidden><span>出力幅 (px)</span>
        <input type="number" required id="png-custom-width" min="16" max="10000" step="1" value="3000" />
      </label>
      <p class="hint" id="png-size-info"></p>
      <div class="button-row">
        <button type="button" id="btn-save-png">PNGを保存</button>
        <button type="button" id="btn-save-svg">SVGを保存</button>
      </div>
      <button type="button" class="secondary-btn" id="btn-copy-png" title="Word・PowerPoint などにそのまま貼り付けられます">PNGをクリップボードにコピー</button>
    </fieldset>
  </section>

  <section class="preview-area">
    <div id="preview" class="preview-surface" aria-live="polite"></div>
    <p class="preview-caption" id="preview-caption"></p>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

</body>
